name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: seuusuario
          outputs: |
            ./assets/snake.svg
      - name: Push to GitHub
        uses: EndBug/add-and-commit@v9
        with:
          add: './assets/snake.svg'
